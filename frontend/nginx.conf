# nginx del frontend.
#
# Sirve el bundle estático y expone un health de liveness propio, de modo que el
# estado del contenedor no dependa de que el backend esté disponible.
#
# No se declaran aquí rutas de API: el enrutado hacia el backend corresponde a la
# capa que consuma sus contratos, no al servidor de ficheros estáticos.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Cabeceras básicas de endurecimiento. La aplicación eventualmente manejará
    # información jurídica, por lo que conviene no filtrar origen ni permitir
    # interpretación de tipos MIME.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Liveness del propio frontend.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    location / {
        # Fallback de aplicación de página única.
        try_files $uri $uri/ /index.html;
    }

    # No exponer archivos ocultos.
    location ~ /\. {
        deny all;
    }
}
