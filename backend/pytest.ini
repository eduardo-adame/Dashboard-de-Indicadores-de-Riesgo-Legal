[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    contract: verifica comportamiento requerido del sistema (p. ej. dimensionalidad fija del modelo)
    robustness: control defensivo de implementación, no exigido por un contrato externo
    requires_db: necesita PostgreSQL accesible
    requires_model: necesita el modelo BGE-M3 descargado
